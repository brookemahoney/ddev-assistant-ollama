#ddev-generated
# Ollama runs inside the web container itself, so there is no extra service to
# define. DDEV already puts restart, labels and the ddev-global-cache mount on
# the web service, and this override only adds what the add-on needs: a way to
# see where the API is without reading the add-on's files.
services:
  web:
    x-ddev:
      describe-info: "Ollama API: http://localhost:11434, http://web:11434 from other containers"
