name: assistant-ollama

project_files:
  - web-build/prepend.Dockerfile.assistant-ollama
  - web-build/Dockerfile.assistant-ollama
  - web-build/ddev-ollama-start
  - config.assistant-ollama.yaml
  - docker-compose.assistant-ollama.yaml

post_install_actions:
